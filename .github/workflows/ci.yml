name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[mcp,dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Check formatting
        run: ruff format --check src tests scripts
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q src tests scripts
      - name: Smoke-test installed CLI
        run: technocore-safe-agent --version

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build frontend
        run: python -m pip install --upgrade pip build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify integration files in source distribution
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile

          source = Path("tests/interop")
          archives = list(Path("dist").glob("*.tar.gz"))
          assert len(archives) == 1, "expected one source distribution"
          with tarfile.open(archives[0]) as archive:
              prefix = archives[0].name.removesuffix(".tar.gz")
              for path in sorted(source.iterdir()):
                  if path.suffix in {".py", ".txt"}:
                      member = archive.extractfile(f"{prefix}/{path.as_posix()}")
                      assert member is not None, f"missing {path} in source distribution"
                      with member:
                          assert member.read() == path.read_bytes(), f"stale {path} in source distribution"
          PY

  interop:
    name: Pinned Technocore compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read server pin
        id: server
        run: echo "revision=$(cat tests/interop/server-revision.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flop-labs/technocore-chat
          ref: ${{ steps.server.outputs.revision }}
          path: .interop-server
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install isolated server and client environments
        run: |
          uv sync --frozen --no-dev --project .interop-server
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python .
      - name: Exercise the real server
        run: >-
          .venv/bin/python -B tests/interop/run.py
          --server-checkout .interop-server
          --server-python .interop-server/.venv/bin/python
