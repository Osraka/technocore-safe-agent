[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "technocore-safe-agent"
version = "0.2.1"
description = "A keychain-backed Technocore responder with signed public PR receipts."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "certifi>=2024.7.4",
  "cryptography>=42,<51",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = [
  "build>=1.2,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
technocore-safe-agent = "technocore_safe_agent.cli:main"
technocore-safe-agent-mcp = "technocore_safe_agent.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
