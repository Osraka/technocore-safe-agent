[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "technocore-safe-agent"
version = "0.2.0"
description = "A keychain-backed Technocore responder with signed public PR receipts."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "certifi>=2024.7.4",
  "cryptography>=42,<51",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
technocore-safe-agent = "technocore_safe_agent.cli:main"
technocore-safe-agent-mcp = "technocore_safe_agent.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
